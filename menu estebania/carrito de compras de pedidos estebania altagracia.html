
<section class="carrito" id="carrito">
    <h2>Carrito de compras</h2>

    <p id="carrito-vacio">Tu carrito está vacío.</p>
    <ul id="lista-carrito"></ul>

    <p class="total">
        Total: <span id="total-carrito">$0.00</span>
    </p>

    <button class="boton" onclick="pagar()">Pagar</button>

    <button class="boton" onclick="vaciarCarrito()">
        Vaciar carrito
    </button>

    <button class="boton" onclick="completarPago()">
        Completar pago
    </button>

    <p id="mensaje-pago"></p>
</section>
